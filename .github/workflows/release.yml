name: Release CI/CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: "[⚙️] Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "[📦] Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: "[🛠️] Install Linux dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libx11-dev

      - name: "[🏷️] Run GoReleaser"
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
